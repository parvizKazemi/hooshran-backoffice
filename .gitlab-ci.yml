stages:
  - pull
  - build
  - deploy

# Development Environment
pull_development:
  stage: pull
  script:
    - docker info
    - cd $PROJECT_DIR
    - git reset --hard origin/develop
    - git pull origin develop
  only:
    - develop
  tags:
    - development

build_development:
  stage: build
  script:
    - cd $PROJECT_DIR
    - docker compose -f docker-compose.dev.yml build
  only:
    - develop
  tags:
    - development

deploy_development:
  stage: deploy
  script:
    - cd $PROJECT_DIR
    - docker compose -f docker-compose.dev.yml up -d --force-recreate --scale backoffice=1
  only:
    - develop
  tags:
    - development

# Production Environment
pull_production:
  stage: pull
  script:
    - docker info
    - cd $PROJECT_DIR
    - git reset --hard origin/main
    - git pull origin main
  only:
    - main
  tags:
    - production

build_production:
  stage: build
  script:
    - cd $PROJECT_DIR
    - docker compose -f docker-compose.prod.yml build
  only:
    - main
  tags:
    - production

deploy_production:
  stage: deploy
  script:
    - cd $PROJECT_DIR
    - docker compose -f docker-compose.prod.yml up -d --force-recreate --scale backoffice=1
  only:
    - main
  tags:
    - production
